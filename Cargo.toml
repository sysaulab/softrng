[package]
name = "softrngproject"
version = "0.2.0"
edition = "2021"



[workspace]
resolver = "2"
members = [
    "f-biski64",
    "f-file",
    "f-hex",
    "f-limit",
    "f-peek",
    "f-pqxo64",
    "f-qxo64",
    "f-xoshiro",
    "f-pcg",
    "s-entropy",
    "s-file",
    "s-seedy64-reset",
    "s-seedy64",
    "s-zeros",
    "softrng",
    "t-hole",
    "t-bits",
]


[dependencies]
anyhow = "1.0"
libc = "0.2"                # only used on linux for madvise
clap = { version = "4.4", features = ["derive"] }